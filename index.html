<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exceptional Realtors</title>
  <style>
    :root { --navy:#002D62; --gold:#C5A059; --gray:#5C6578; --line:#D8DEE8; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    .tag { font-size: 18px; color: var(--gray); margin-bottom: 36px; }
    .links { display: inline-flex; flex-direction: column; gap: 14px; margin-top: 10px; }
    .btn { display: block; background:#fff; border:1px solid var(--line); border-radius: 10px;
           padding: 16px 28px; text-decoration: none; color: var(--navy); font-weight: 600; font-size: 17px; min-width: 280px; }
    .btn:hover { border-color: var(--gold); }
    footer { margin-top: 56px; font-size: 14px; color: #7A8FA3; }
    a.email { color:#1f6feb; }
  </style>
</head>

    </footer>
  </div>
</body>
</html>
